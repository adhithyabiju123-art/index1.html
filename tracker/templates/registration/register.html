<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Mood Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7b1fa2, #2196f3);
        }

        .signup-box {
            width: 380px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .signup-box h1 {
            color: #1e62d0;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .signup-box p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        form p {
            text-align: left;
            margin-bottom: 12px;
            font-size: 13px;
            color: #333;
        }

        form input {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .helptext {
            display: block;
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1e62d0;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #1852b0;
        }

        .login-link {
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #1e62d0;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="signup-box">
    <h1>Create Account</h1>
    <p class="subtitle">Join Mood Tracker today</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="{% url 'login' %}">Log In</a>
    </div>
</div>
<!-- Add this right above the <button type="submit"> in register.html -->
<label class="show-password-container" style="display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; color: #555; cursor: pointer;">
    <input type="checkbox" id="toggleRegisterPassword" style="width: auto;"> Show Passwords
</label>

<script>
    const toggleRegisterPassword = document.getElementById('toggleRegisterPassword');

    toggleRegisterPassword.addEventListener('change', function() {
        // Django's password fields inside forms default to type="password"
        const passwordFields = document.querySelectorAll('input[type="password"], input[data-password]');

        passwordFields.forEach(field => {
            if (this.checked) {
                field.dataset.password = "true"; // Tag it so we remember it was a password field
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        });
    });
</script>

</body>
</html>
